<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color"
          content="#efebff">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Studentbevis">

    <link rel="manifest"
          href="manifest.json">

    <link rel="apple-touch-icon"
          href="icon-192.png">

    <link rel="stylesheet"
          href="styles.css">

    <title>Studentbevis</title>
</head>

<body>

<div class="app">

  <!-- Header -->
 <header class="header">

    <div class="logo">
        <img src="LogoSikt.png" alt="Sikt" class="logo-img">
    </div>

    <div class="menu">
        <span></span>
        <span></span>
        <span></span>
    </div>

</header>


  <main class="content">

    <!-- Profile -->
    <div class="profile">
      KM
    </div>


    <!-- Student information -->
    <section class="student-card">

      <h1>Eksempel Student (25)</h1>

      <div class="row">
        <div class="icon">▣</div>

        <div>
          <strong>Fødselsdato:</strong>
          10.05.2001
        </div>
      </div>


      <div class="row">
        <div class="icon">▤</div>

        <div>
          <strong>Studentnummer:</strong>
          000000
        </div>
      </div>


      <div class="row">
        <div class="icon">◇</div>

        <div class="study-row">
          <strong>Studiested:</strong>

          <span>
            Norges teknisk-<br>
            naturvitenskapelige universitet
          </span>
        </div>
      </div>

    </section>


    <!-- Student validity -->
    <section
      id="studentStatus"
      class="status-card"
    >

      <h2>Gyldig studentbevis</h2>

      <p>Vår 2026</p>

      <div class="expire">
        <strong>Utløper:</strong>
        <span>31.08.2026</span>
      </div>

    </section>


    <!-- Kontroll -->
    <button
      id="controlButton"
      class="control-button"
    >
      Kontroll
    </button>


    <!-- European card -->
    <button class="europe-button">

      <span>
        Europeisk studentbevis
      </span>

      <div class="qr">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </button>


    <!-- Bottom information -->
    <div class="bottom-info">

      <p>
        <strong>Sist oppdatert:</strong>
        <span id="updatedTime"></span>
      </p>

      <p>
        <strong>Tidssone:</strong>
        Europe/Oslo
      </p>

      <p>
        <strong>Versjon:</strong>
        4.3.0
      </p>

    </div>

  </main>

</div>


<script src="script.js"></script>

</body>
</html>
